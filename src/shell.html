  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}

/* ---------- layout ---------- */
#app{min-height:100vh}
.shell{padding-bottom:calc(var(--nav-h) + 8px)}
.page{max-width:var(--max);margin:0 auto;padding:0 20px}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(251,250,247,.88);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--rule)}
.topbar-in{max-width:var(--max);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;min-height:52px}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em}
.brand .dot{color:var(--accent)}
.topbar .sp{flex:1}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink2)}
.iconbtn:hover{background:var(--rule2);color:var(--ink)}
.iconbtn.on{color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);padding:6px 0;white-space:nowrap}
.back:hover{color:var(--ink)}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;color:var(--ink4);font-size:10px;letter-spacing:.02em}
.nav a.on{color:var(--accent)}
.nav svg{width:20px;height:20px}

/* ---------- typography ---------- */
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.eyebrow.acc{color:var(--accent)}
.greet{font-family:var(--serif);font-size:15px;color:var(--ink3);font-style:italic;margin:14px 0 2px}
h1.display{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.14;letter-spacing:-.015em;margin:2px 0 6px}
h1.idea{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;letter-spacing:-.02em;margin:6px 0 10px}
h2.sec{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px}
h3.sub{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 8px;letter-spacing:-.01em}
.prose{font-family:var(--serif);font-size:17.5px;line-height:1.68;color:var(--ink)}
.prose p{margin:0 0 15px}
.lead{font-family:var(--serif);font-size:22px;line-height:1.42;letter-spacing:-.012em;margin:0 0 4px}
.meta{font-size:12.5px;color:var(--ink3)}
.dotsep::before{content:"·";margin:0 7px;color:var(--ink4)}
.sectionrule{height:1px;background:var(--rule);margin:30px 0 26px;border:0}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:20px;transition:border-color .18s,transform .18s}
.card:hover{border-color:var(--ink4)}
.card.tap:active{transform:scale(.994)}
.feature{padding:24px 22px 18px;border-color:var(--accent-line);position:relative;overflow:hidden}
.feature::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.feature .fthesis{font-family:var(--serif);font-size:26px;line-height:1.24;letter-spacing:-.018em;margin:10px 0 12px}
.feature .fbody{font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink2);margin:0 0 16px}
.src{font-size:12.5px;color:var(--ink3);font-family:var(--serif);font-style:italic}
.rowcard{display:block;padding:18px 20px;margin-bottom:10px}
.rowcard .rthesis{font-family:var(--serif);font-size:18.5px;line-height:1.36;letter-spacing:-.01em;margin:8px 0 10px}
.cardfoot{display:flex;align-items:center;gap:10px;margin-top:2px}
.cardfoot .sp{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 17px;border-radius:10px;font-size:13.5px;font-weight:500;border:1px solid var(--rule);background:var(--paper);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--ink4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 13px;font-size:12.5px;border-radius:9px}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink3)}
.btn.gh:hover{color:var(--ink);background:var(--rule2)}
.btn svg{width:15px;height:15px;flex:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;height:27px;padding:0 11px;border-radius:7px;background:var(--rule2);color:var(--ink2);font-size:12px;font-weight:500;border:1px solid transparent}
a.tag:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pill.soon{background:#F4F1E9;color:var(--ink3)}
.pill.rel{background:var(--accent-soft);color:var(--accent-ink)}
.pill.state{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- book ---------- */
.booklist{display:flex;flex-direction:column;gap:12px}
.bookcard{display:flex;gap:16px;align-items:flex-start}
.cover{width:60px;height:88px;border-radius:5px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.13)}
.cover.lg{width:84px;height:122px;font-size:34px}
.progress{height:3px;border-radius:2px;background:var(--rule);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;margin:0 -20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{flex:none}

/* ---------- key ideas list ---------- */
.klist{border-top:1px solid var(--rule)}
.kitem{display:flex;gap:15px;padding:15px 2px;border-bottom:1px solid var(--rule2);align-items:baseline}
.kitem:hover{background:linear-gradient(90deg,rgba(46,90,78,.035),transparent)}
.knum{font-family:var(--serif);font-size:13px;color:var(--ink4);width:24px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}
.ktitle{font-family:var(--serif);font-size:18px;letter-spacing:-.01em;margin:0 0 3px}
.kthesis{font-size:13.5px;color:var(--ink2);line-height:1.45}
.kbook{width:19px;height:19px;border-radius:5px;flex:none;margin-left:12px;display:grid;place-items:center;font-family:var(--serif);font-size:11px;line-height:1;color:rgba(255,255,255,.94);align-self:center}
.kitem > .kbook{margin-left:auto}
.kchk{color:var(--accent);flex:none;opacity:.9;padding-left:10px;align-self:center}
.kchk svg{width:15px;height:15px;display:block}

/* ---------- idea page ---------- */
.blk{margin:26px 0}
.blk .lbl{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.practice{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:20px}
.practice .plead{font-family:var(--serif);font-size:17px;line-height:1.55;margin:0 0 14px}
.practice ul{list-style:none;margin:0;padding:0}
.practice li{position:relative;padding:0 0 0 20px;margin-bottom:9px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.practice li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}
.quotebox{border-left:2px solid var(--accent);padding:2px 0 2px 18px;margin:0 0 14px}
.quotebox q{font-family:var(--serif);font-size:19.5px;line-height:1.48;font-style:italic;quotes:none}
.quotebox .attr{display:block;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.noquote{border:1px dashed var(--rule);border-radius:12px;padding:15px 16px;color:var(--ink3);font-size:13.5px;line-height:1.55}
.relgrid{display:flex;flex-direction:column;gap:9px}
.rel{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.rel:hover{border-color:var(--ink4)}
.rel .rt{font-family:var(--serif);font-size:16.5px;letter-spacing:-.01em}
.rel .rs{font-size:12px;color:var(--ink3);margin-top:2px}
.rel .arrow{margin-left:auto;color:var(--ink4)}
.notewrap textarea{width:100%;min-height:96px;resize:vertical;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px;font-family:var(--serif);font-size:16px;line-height:1.6;outline:none}
.notewrap textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.savedhint{font-size:12px;color:var(--accent);margin-top:8px;height:14px}
.actionbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

/* ---------- search ---------- */
.searchwrap{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:11px;padding:0 13px;height:44px}
.searchwrap input{flex:1;border:0;outline:none;background:none;font-size:15px}
.searchwrap svg{width:16px;height:16px;color:var(--ink3);flex:none}
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.ovhead{padding:14px 20px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:center;max-width:var(--max);margin:0 auto;width:100%}
.ovbody{flex:1;overflow-y:auto;padding:18px 20px 40px;max-width:var(--max);margin:0 auto;width:100%}
.hint{font-size:13px;color:var(--ink3);line-height:1.6}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.exlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.exitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;font-size:13.5px;line-height:1.5;color:var(--ink2);transition:.15s}
.exitem:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.exitem span{flex:1}
.exitem svg{flex:none;color:var(--ink4)}
.findic svg{width:22px;height:22px;flex:none;display:block}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(27,26,23,.34);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 30px}
.sheethead{position:sticky;top:0;background:var(--bg);padding:16px 20px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;z-index:2}
.sheetbody{padding:20px}
.applyout{margin-top:22px}
.applyout .ablk{margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--rule2);color:var(--ink2)}

/* ---------- misc ---------- */
.seg{display:inline-flex;background:var(--rule2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink3)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stats{display:flex;gap:0;border:1px solid var(--rule);border-radius:14px;background:var(--paper);overflow:hidden}
.stat{flex:1;padding:16px 14px;text-align:center;border-right:1px solid var(--rule2)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:400;line-height:1}
.stat span{font-size:11px;color:var(--ink3);letter-spacing:.04em;margin-top:5px;display:block}
.empty{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty .em{font-family:var(--serif);font-size:19px;color:var(--ink2);margin-bottom:6px}
.empty .eicon{display:inline-flex;margin-bottom:14px;color:var(--ink4)}
.empty .eicon svg{width:28px;height:28px;display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{height:34px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);padding:0 10px;font-size:12.5px;color:var(--ink2)}
.footnote{font-size:11.5px;color:var(--ink4);line-height:1.6;margin:34px 0 8px}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:26px}
.gatebox{max-width:360px;width:100%}
.gbrand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gmark{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:15px;color:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.13)}
.gatebox h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em;margin:0 0 8px}
.gatebox p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin:0 0 22px}
.gstats{margin:0 0 22px}
.gstats .stat{padding:13px 6px}
.gstats .stat b{font-size:22px}
.gatebox input{width:100%;height:46px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);padding:0 14px;font-size:15px;outline:none;margin-bottom:10px}
.gatebox input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:#A2472F;font-size:12.5px;height:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px);z-index:95;background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- graph ---------- */
.graphwrap{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:6px;margin-bottom:16px}
.graphwrap svg{display:block;width:100%;height:auto}
.gnode circle{transition:opacity .15s}
.gnode:hover circle{opacity:.82}
.gnode text{font-family:var(--serif);fill:var(--ink2);font-size:9.2px;letter-spacing:0}
.gmono{font-family:var(--serif);fill:rgba(255,255,255,.95);text-anchor:middle;dominant-baseline:central}
.gcentre text{font-size:10.5px;fill:var(--ink)}
.glegend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 18px;font-size:11.5px;color:var(--ink3)}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend i{width:20px;height:0;border-top-width:1.6px;display:inline-block}
.gpair{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--rule2);font-size:13.5px}
.gpair .gp-n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12.5px}
.gdot{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:9.5px;color:rgba(255,255,255,.94)}
.gpairbooks{display:flex;gap:4px;flex:none}
.gnum{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:12.5px;color:rgba(255,255,255,.95)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--nav-h:0px;--max:720px}
  .nav{position:fixed;left:0;top:0;bottom:0;right:auto;width:238px;flex-direction:column;border-top:0;border-right:1px solid var(--rule);background:transparent;backdrop-filter:none;padding:26px 16px}
  .nav .navbrand{font-family:var(--serif);font-size:22px;padding:0 12px 26px;letter-spacing:-.015em}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;letter-spacing:0}
  .nav a:hover{background:var(--rule2);color:var(--ink)}
  .nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
  .nav .navfoot{margin-top:auto;padding:0 12px;font-size:11.5px;color:var(--ink4);line-height:1.5}
  .shell{padding-left:238px;padding-bottom:60px}
  .topbar{padding-left:238px}
  .topbar .brand{display:none}
  h1.display{font-size:36px}
  h1.idea{font-size:44px}
  .modal{align-items:center;padding:24px}
  .sheet{border-radius:18px;max-height:88vh}
  .booklist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .overlay{padding-left:238px}
}
@media (min-width:1280px){
  .ideawrap{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:44px;align-items:start;max-width:1010px}
  .ideawrap aside{position:sticky;top:78px;font-size:13px}
  .ideawrap aside .relgrid{gap:7px}
  .ideawrap aside .rel{padding:11px 13px}
  .ideawrap aside .rel .rt{font-size:14.5px}
  .page.wide{max-width:1010px}
}
</style>
</head>
